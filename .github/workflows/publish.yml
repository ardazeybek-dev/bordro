name: npm publish

# Publishes from GitHub's runner rather than from a local machine.
# Why: publishing directly makes npm ask for a one-time 2FA code every time.
#
# To run it: Actions tab -> "npm publish" -> Run workflow
# It also runs by itself when a release is published.
#
# The only requirement: a repository secret named NPM_TOKEN
# (npmjs.com -> Access Tokens -> Generate New Token -> Granular Access Token,
#  "Read and write" permission, then GitHub -> Settings -> Secrets and variables
#  -> Actions -> New repository secret)

on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # needed for provenance (proof of where the package was built)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      - run: npm ci

      # npm publish already runs the type check and the tests through
      # prepublishOnly, so a broken package cannot reach the registry.
      - name: Publish
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
