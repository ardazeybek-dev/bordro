name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build

  web-guncel:
    name: is the demo page engine up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      # docs/index.html drives the calculation engine through docs/index.js.
      # If the source changes and the built copy is not committed, the page
      # keeps running the old logic.
      - name: is docs/index.js in sync with the source?
        run: |
          if ! git diff --exit-code -- docs/index.js; then
            echo "::error::docs/index.js is out of date. Run 'npm run build' and commit docs/index.js."
            exit 1
          fi
